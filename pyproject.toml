[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csfinet-repro"
version = "2.0.4"
description = "CSFINet multimodal MRI segmentation and survival research implementation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.15,<1.16", "h5py>=3.16,<3.17"]

[project.optional-dependencies]
training = ["torch==2.7.1", "torchvision==0.22.1", "nibabel==5.3.2", "captum==0.8.0", "matplotlib>=3.9,<3.11"]
viewer = ["streamlit==1.49.1", "pandas>=2.2,<3", "nibabel==5.3.2", "matplotlib>=3.9,<3.11"]
test = ["pytest>=8,<10"]
all = ["csfinet-repro[training,viewer,test]"]

[tool.setuptools.packages.find]
include = ["csfinet_repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
